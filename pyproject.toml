[project]
name = "czech-opportunity-radar"
version = "0.1.0"
description = "Deterministic collection and ranking of Czech AI/data opportunities"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[tool.setuptools.packages.find]
include = ["scraper*", "worker*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
