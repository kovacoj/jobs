name: Refresh opportunities

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-opportunities
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out collector
        uses: actions/checkout@v4
        with:
          path: collector

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/pyproject.toml

      - name: Install dependencies
        run: pip install -e './collector[dev]'

      - name: Test and scrape
        working-directory: collector
        run: |
          pytest
          python -m scraper.main

      - name: Persist collector state
        working-directory: collector
        run: |
          if git diff --quiet -- data; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore(data): refresh opportunities"
          git push

      - name: Check out Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Publish current data to Pages branch
        run: |
          cp collector/data/jobs.json site/public/data/jobs.json
          cp collector/data/source_status.json site/public/data/source_status.json
          cd site
          if git diff --quiet -- public/data; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "chore(data): refresh opportunities"
          git push
